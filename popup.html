<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>body{font:14px system-ui;background:#0d1220;color:#f5f7ff;width:310px;padding:16px;margin:0}h2{font-size:17px;margin:0 0 4px}.muted{color:#9baac8;font-size:12px}.panel{background:#1b2336;padding:14px;border-radius:12px;margin-top:16px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px}button{background:#334155;color:white;border:0;border-radius:30px;padding:9px 17px;cursor:pointer}button.on{background:#10b981;color:#031d15}#status{margin-top:12px;background:#101827;padding:12px;border-radius:9px}#detail{overflow-wrap:anywhere;margin-top:8px}#timer{font-size:32px;font-weight:700;margin-top:12px;font-variant-numeric:tabular-nums}small{color:#9baac8}#count{margin-top:14px}</style></head><body><h2>💎 Jamble Gemas v1.5</h2><div class="muted">Coleta com pausa por cronômetro</div><div class="panel"><div class="line"><strong>Coleta automática</strong><button id="toggle">Carregando...</button></div><div id="status">Carregando status...</div><div id="timer">--:--</div><div id="detail" class="muted"></div><div id="count" class="muted"></div></div><p><small>Enquanto o timer estiver ativo, nenhum clique será enviado. “Próximo dia” desliga a coleta. Cliques não comprovam crédito.</small></p><script src="popup.js"></script></body></html>
